[package]
name = "sourceorigin-standard"
description = "The engineering standard of piqueld, sourceorigin and DirkEngine as checks a repository's `cargo xtask` runs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["xtask", "lint", "ci", "standard"]
categories = ["development-tools", "development-tools::testing"]

[dependencies]
globset.workspace = true
proc-macro2.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
thiserror.workspace = true
toml.workspace = true
yaml-rust2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# proc-macro2 is a dependency only to turn on `span-locations`, which gives
# syn's spans their lines; the code never names it.
[package.metadata.cargo-machete]
ignored = ["proc-macro2"]
