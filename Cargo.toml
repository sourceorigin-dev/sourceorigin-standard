[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sourceorigin-dev/sourceorigin-xtask"

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Every warning fails CI: `just lint` runs Clippy with `-D warnings`. The
# groups sit at priority -1 so the single lints below can override them.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# No `unwrap` anywhere: `expect` says what should have held. Tests may
# expect, panic and dbg (see clippy.toml); production code propagates errors.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Every exception names its lint with `#[expect]` and says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# Modules with children live in `foo/mod.rs`, never a `foo.rs` beside `foo/`.
self_named_module_files = "warn"
