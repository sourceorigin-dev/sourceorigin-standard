[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sourceorigin-dev/sourceorigin-standard"

[workspace.dependencies]
sourceorigin-standard = { path = "crates/sourceorigin-standard", version = "0.1.0" }

# The error chain at the edge of this repository's own xtask; the library
# returns `thiserror` errors.
anyhow = "1.0.100"
# Path globs; with `literal_separator`, they match as paths-filter's picomatch
# does with `dot: true`. Its only default feature is logging.
globset = { version = "0.4.21", default-features = false }
# `cargo metadata`'s JSON.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Scratch git repositories in tests.
tempfile = "3.27.0"
thiserror = "2.0.18"
# `standard.toml` and the manifests the rules read.
toml = { version = "1.2.0", default-features = false, features = ["std", "serde", "parse"] }
# Pure Rust, and it resolves the YAML anchors filters reuse each other with.
# Its only default feature decodes non-UTF-8 input, which a string never is.
yaml-rust2 = { version = "0.13.2", default-features = false }

# Every lint warns, and `just lint` passes `-D warnings`: a module that needs
# `unsafe` expects `unsafe_code`, which `forbid` wouldn't allow.
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

# Every warning fails CI: `just lint` runs Clippy with `-D warnings`. The
# groups sit at priority -1 so the single lints below can override them.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# No `unwrap` anywhere: `expect` says what should have held. Tests may
# expect, panic and dbg (see clippy.toml); production code propagates errors.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Every exception names its lint with `#[expect]` and says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# Modules with children live in `foo/mod.rs`, never a `foo.rs` beside `foo/`.
self_named_module_files = "warn"
