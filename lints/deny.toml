# ../deny.toml's policy, for the lints' own dependency graph.
[advisories]
version = 2
# paste is unmaintained, not vulnerable: dylint_linting's lint macros use it.
# The ignore ends when dylint_linting drops it.
ignore = ["RUSTSEC-2024-0436"]

# rustc_apfloat (under clippy_utils) carries Apache-2.0 WITH LLVM-exception.
[licenses]
version = 2
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0"]

[bans]
wildcards = "deny"
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
