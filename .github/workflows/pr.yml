# Runs the standard's pull request checks on this repository's own pull
# requests, as every repository does. `pull_request_target` runs the default
# branch's workflow, and the checks read their settings at the base, so a
# pull request can't loosen its own checks. It is safe here: no step checks
# out or runs the pull request's code, and the token only reads.

name: PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standard:
    uses: ./.github/workflows/pr-checks.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read
