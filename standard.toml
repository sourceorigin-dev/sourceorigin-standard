# How this repository applies the standard it ships (see the crate's README).

[pr-checks]
scopes = ["check-changed", "rules", "lints", "pr-checks", "skills", "xtask"]
approvers = ["PiquelChips"]

[deviations]
unsafe-modules = { reason = "Dylint loads register_lints by its unmangled name", paths = ["lints/src/lib.rs"] }
